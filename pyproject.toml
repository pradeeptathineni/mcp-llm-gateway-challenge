[project]
name = "mcp-llm-gateway-challenge"
version = "0.1.0"
description = "Validated MCP tools and security-aware streaming model gateways"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic==2.13.5", "starlette>=1.7,<2", "uvicorn>=0.54,<1"]

[dependency-groups]
dev = ["ruff==0.16.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
